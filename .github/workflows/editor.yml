name: Build checks

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  editor:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: editor/src-tauri
      - run: ./build.ps1 -Target test

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: idf.py -C firmware build
      - uses: actions/upload-artifact@v4
        with:
          name: screendeck-firmware
          path: |
            firmware/build/screendeck.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
